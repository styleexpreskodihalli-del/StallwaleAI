<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stallGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5B700" />
      <stop offset="45%" stopColor="#FFDF6B" />
      <stop offset="100%" stopColor="#C88A00" />
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#F5B700" stopOpacity="0.16" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>
  </defs>
  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="#070709" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#iconGlow)" stroke="#232329" strokeWidth="4" />

  <!-- Golden Crest Shield -->
  <path
    d="M256 64 C298 96 352 116 408 124 V246 C408 342 338 414 256 456 C174 414 104 342 104 246 V124 C160 116 214 96 256 64 Z"
    fill="#09090C"
    stroke="url(#stallGold)"
    strokeWidth="22"
    strokeLinejoin="round"
  />

  <!-- Serif 'S' (White) -->
  <text
    x="156"
    y="302"
    fill="#FFFFFF"
    fontFamily="Georgia, 'Times New Roman', Times, serif"
    fontWeight="700"
    fontSize="206"
  >
    S
  </text>

  <!-- Overlapping Serif 'T' (Gold) -->
  <text
    x="234"
    y="314"
    fill="url(#stallGold)"
    fontFamily="Georgia, 'Times New Roman', Times, serif"
    fontWeight="700"
    fontSize="168"
  >
    T
  </text>

  <!-- 4-Pointed Gold Star Sparkle -->
  <path
    d="M256 340 L265 365 L290 374 L265 383 L256 408 L247 383 L222 374 L247 365 Z"
    fill="url(#stallGold)"
  />
</svg>
